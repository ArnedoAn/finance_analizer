name: Build, Push and Deploy (GHCR)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: finance-analyzer
  IMAGE: ghcr.io/${{ github.repository_owner }}/finance-analyzer

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finance_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: finance_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finance_test -d finance_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FINANCE_API_KEY: ci-finance-admin-key-at-least-32-characters
      PHONE_API_KEY: ci-phone-ingest-key-at-least-32-characters
      SCHEDULER_ENABLED: "false"
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+asyncpg://finance_test:test_password@localhost:5432/finance_test' || 'sqlite+aiosqlite:///./data/ci.db' }}
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+asyncpg://finance_test:test_password@localhost:5432/finance_test' || 'sqlite+aiosqlite:///:memory:' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.11"
      - name: Install Python and locked dependencies
        run: |
          uv python install 3.12
          uv sync --frozen --python 3.12 --extra dev
      - name: Ruff
        run: uv run --frozen ruff check app tests alembic
      - name: Migrate empty database
        run: uv run --frozen alembic upgrade head
      - name: Tests
        run: uv run --frozen pytest

  build-and-push:
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # v4: never deploy on push. Secrets (FIELD_ENCRYPTION_KEY_FILE, ...) must exist on the
  # server first, and the owner's server AI deploys following docs/DEPLOY.md. Manual only.
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify Webhook
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -eu
          : "${COOLIFY_URL:?Set repository variable COOLIFY_URL}"
          : "${COOLIFY_TOKEN:?Set repository secret COOLIFY_TOKEN}"
          curl --fail --silent --show-error -X POST "$COOLIFY_URL" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
