services:
  finance-analyzer:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/finance_v2.db
      TZ: America/Bogota
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    volumes:
      - ./app:/app/app
      - finance-dev-data:/app/data
volumes:
  finance-dev-data:
