services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance_analyzer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-finance_analyzer_v2}
    volumes:
      - postgres-v2-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
  finance-analyzer:
    image: ${FINANCE_IMAGE:?Set FINANCE_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      EXPOSE_DOCS: ${EXPOSE_DOCS:-false}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-finance_analyzer}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finance_analyzer_v2}
      TZ: America/Bogota
      # Only the reverse proxy's IP may set X-Forwarded-For. Required (no default, fails closed) and
      # NEVER "*": any client could spoof the IP used by the failed-key limiter.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:?Set FORWARDED_ALLOW_IPS to the proxy IP, never *}
      # AES-GCM master key for raw_text: a file path inside the container, never an env value.
      FIELD_ENCRYPTION_KEY_FILE: ${FIELD_ENCRYPTION_KEY_FILE:-/run/secrets/finance/field_encryption_key}
    volumes:
      # Same layout as infra/compose/finance-analyzer.v4.yml: directory 0700, files 0400 owned by uid 999.
      - ${FINANCE_SECRETS_DIR:-/opt/finance-analyzer/secrets}:/run/secrets/finance:ro
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-v2-data:
