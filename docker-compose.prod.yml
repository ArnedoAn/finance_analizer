services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance_analyzer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-finance_analyzer_v2}
    volumes:
      - postgres-v2-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
  finance-analyzer:
    image: ${FINANCE_IMAGE:?Set FINANCE_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      FINANCE_API_KEY: ${FINANCE_API_KEY:?Set FINANCE_API_KEY}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-finance_analyzer}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finance_analyzer_v2}
      TZ: America/Bogota
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-v2-data:
